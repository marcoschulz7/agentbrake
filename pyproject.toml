[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbrake-sdk"
version = "0.1.1"
description = "The emergency brake for multi-agent systems. Stop runaway LangChain & CrewAI agents in real time — before 50 cents becomes $47,000."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentBrake" }]
keywords = ["langchain", "crewai", "ai-agents", "llm", "cost-control", "observability", "finops", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.80"]
all = ["langchain-core>=0.2", "crewai>=0.80"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://agentbrake.dev"
Repository = "https://github.com/marcoschulz7/agentbrake"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbrake"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
